name: quality-gates

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: caption-studio-publish-main

jobs:
  frontend-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI validates a separately hosted frontend/API build. Production must
      # replace this non-routable test origin with the real API origin.
      VITE_API_BASE_URL: https://api.example.invalid
      VITE_FIREBASE_APP_CHECK_SITE_KEY: ci-app-check-placeholder
      VITE_LEGAL_BUSINESS_NAME: Lekha Captions CI Test
      VITE_LEGAL_BUSINESS_ADDRESS: CI test address, not for deployment
      VITE_GOVERNING_VENUE: CI test venue
      VITE_GRIEVANCE_OFFICER_NAME: CI Grievance Officer
      VITE_GRIEVANCE_EMAIL: grievance@example.invalid
      VITE_APP_RELEASE: ${{ github.sha }}
      PUPPETEER_CI_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: caption-studio-publish-main/package-lock.json
      - run: npm ci
      - run: npm run release:check
      - run: npm run security:audit

  template-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: caption-studio-publish-main/package-lock.json
      - run: npm ci
      - run: npm run test:template-parity
      - run: npm run test:template-visual
      - run: npm run test:lc-playback

  template-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUPPETEER_CI_NO_SANDBOX: "1"
    strategy:
      fail-fast: false
      matrix:
        script:
          - test:template-export
          - test:template-export:all-left
          - test:template-export:all-right-phases
          - test:template-export:all-basic
          - test:template-export:all-basic-scaled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: caption-studio-publish-main/package-lock.json
      - run: npm ci
      - run: npx puppeteer browsers install chrome-headless-shell
      - run: npm run ${{ matrix.script }}

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: caption-studio-publish-main/backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      - run: python -m py_compile backend/main.py backend/firebase_admin_setup.py backend/worker.py
      - run: python -m unittest backend.tests.test_api_contracts backend.tests.test_smoke_flow backend.tests.test_caption_postprocess backend.tests.test_preview_export_parity backend.tests.test_audio_less_fallback backend.tests.test_firebase_storage_helpers
      - run: docker build --tag lekha-captions-ci .
      - run: pip install pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit -r backend/requirements.lock
      - run: bandit -r backend -x backend/tests -ll -ii

  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: caption-studio-publish-main/landing-next
    env:
      NEXT_PUBLIC_LEGAL_BUSINESS_NAME: Lekha Captions CI Test
      NEXT_PUBLIC_LEGAL_BUSINESS_ADDRESS: CI test address, not for deployment
      NEXT_PUBLIC_GOVERNING_VENUE: CI test venue
      NEXT_PUBLIC_GRIEVANCE_OFFICER_NAME: CI Grievance Officer
      NEXT_PUBLIC_GRIEVANCE_EMAIL: grievance@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: caption-studio-publish-main/landing-next/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: https://api.example.invalid
      VITE_FIREBASE_APP_CHECK_SITE_KEY: ci-app-check-placeholder
      VITE_LEGAL_BUSINESS_NAME: Lekha Captions CI Test
      VITE_LEGAL_BUSINESS_ADDRESS: CI test address, not for deployment
      VITE_GOVERNING_VENUE: CI test venue
      VITE_GRIEVANCE_OFFICER_NAME: CI Grievance Officer
      VITE_GRIEVANCE_EMAIL: grievance@example.invalid
      VITE_APP_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: caption-studio-publish-main/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
