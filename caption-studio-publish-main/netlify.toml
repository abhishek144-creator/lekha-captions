[build]
  command = "npm run build:guarded"
  publish = "dist"

# Preserve old bookmarks while keeping the editor on the apex domain.
[[redirects]]
  from = "https://app.lekhacaptions.com/*"
  to = "https://lekhacaptions.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://app.lekhacaptions.com/*"
  to = "https://lekhacaptions.com/:splat"
  status = 301
  force = true

# Canonical public aliases; keep these before the SPA fallback.
# Netlify normalizes trailing slashes itself: slash-only redirect rules loop.
[[redirects]]
  from = "/Home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/HomeV2"
  to = "/homev2"
  status = 301
  force = true

[[redirects]]
  from = "/Login"
  to = "/login"
  status = 301
  force = true

[[redirects]]
  from = "/Faq"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/HelpAndSupport"
  to = "/helpandsupport"
  status = 301
  force = true

[[redirects]]
  from = "/TermsAndConditions"
  to = "/termsandconditions"
  status = 301
  force = true

[[redirects]]
  from = "/PrivacyPolicy"
  to = "/privacypolicy"
  status = 301
  force = true

[[redirects]]
  from = "/RefundPolicy"
  to = "/refundpolicy"
  status = 301
  force = true

[[redirects]]
  from = "/AcceptableUsePolicy"
  to = "/acceptableusepolicy"
  status = 301
  force = true

[[redirects]]
  from = "/KnownLimitations"
  to = "/knownlimitations"
  status = 301
  force = true

[[redirects]]
  from = "/Changelog"
  to = "/changelog"
  status = 301
  force = true

[[redirects]]
  from = "/Status"
  to = "/status"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    "Content-Security-Policy" = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'nonce-lekha-template-preview-v1' 'sha256-nuF1+itnyWZpSrGpYCCq2I3cC29kh7Np7md2u0giq4A=' https://browser.sentry-cdn.com https://apis.google.com https://www.google.com https://www.gstatic.com https://checkout.razorpay.com https://cdn.razorpay.com https://www.googletagmanager.com; frame-src 'self' https://www.google.com https://recaptcha.google.com https://*.razorpay.com https://*.firebaseapp.com; connect-src 'self' https://*.r2.cloudflarestorage.com https://api.lekhacaptions.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.razorpay.com https://*.sentry.io https://www.google.com https://www.gstatic.com https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com"
    "X-Content-Type-Options" = "nosniff"
    "X-Frame-Options" = "DENY"
    "Strict-Transport-Security" = "max-age=31536000; includeSubDomains"
    "Referrer-Policy" = "strict-origin-when-cross-origin"
    "Permissions-Policy" = "camera=(), microphone=(), geolocation=(), payment=(self)"
    "Cross-Origin-Opener-Policy" = "same-origin-allow-popups"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache,no-store,must-revalidate"

[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-cache,no-store,must-revalidate"
