[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20.19.0"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://apis.google.com https://checkout.razorpay.com; frame-src 'self' https://*.razorpay.com https://*.firebaseapp.com; connect-src 'self' https:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/__/auth/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https:; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.gstatic.com https://www.googleapis.com; connect-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/__/auth/handler"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/__/auth/iframe"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/__/auth/links"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"
