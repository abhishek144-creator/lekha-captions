[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health/readiness"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Keep the previous healthy instance available while the replacement starts,
# then allow active video requests and export jobs to exit cleanly.
overlapSeconds = 30
drainingSeconds = 120
