<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lekha Captions icon">
  <defs>
    <linearGradient id="lk-play" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B9770A"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <radialGradient id="lk-rays" cx="128" cy="128" r="100" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#C98410"/>
      <stop offset="1" stop-color="#FFD166"/>
    </radialGradient>
  </defs>

  <!-- caption-bar rays: rounded bars of uneven length/weight, fully radial -->
  <g stroke="url(#lk-rays)" stroke-linecap="round" fill="none">
    <g stroke-width="12">
      <line x1="196" y1="128" x2="224" y2="128"/>
      <line x1="94"  y1="186.9" x2="80"  y2="211.1"/>
      <line x1="94"  y1="69.1"  x2="80"  y2="44.9"/>
    </g>
    <g stroke-width="12">
      <line x1="162" y1="186.9" x2="173" y2="205.9"/>
      <line x1="60"  y1="128"   x2="38"  y2="128"/>
      <line x1="162" y1="69.1"  x2="173" y2="50.1"/>
    </g>
    <g stroke-width="7">
      <line x1="185.2" y1="161" x2="200.7" y2="170"/>
      <line x1="128"   y1="194" x2="128"   y2="212"/>
      <line x1="70.8"  y1="161" x2="55.3"  y2="170"/>
      <line x1="70.8"  y1="95"  x2="55.3"  y2="86"/>
      <line x1="128"   y1="62"  x2="128"   y2="44"/>
      <line x1="185.2" y1="95"  x2="200.7" y2="86"/>
    </g>
  </g>

  <!-- rounded play button, glowing amber-to-gold -->
  <path d="M110 98 L110 158 L162 128 Z"
        fill="url(#lk-play)" stroke="url(#lk-play)"
        stroke-width="22" stroke-linejoin="round"/>
</svg>
