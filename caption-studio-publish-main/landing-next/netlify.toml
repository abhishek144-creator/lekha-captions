[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_APP_URL = "https://lekhacaptions.com/Dashboard?entry=editor"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/landing/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Serve editor routes under the same domain without replacing the SEO homepage.
# Use the Netlify subdomain so the legacy app-domain redirect cannot loop.
# Request index.html directly to avoid a second upstream SPA rewrite.

[[redirects]]
  from = "/Dashboard"
  to = "https://lekha-captions-staging.netlify.app/index.html"
  status = 200
  force = true

