steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - BASE_IMAGE=${_BASE_IMAGE}
      - --build-arg
      - OLD_API_URL=${_OLD_API_URL}
      - --build-arg
      - NEW_API_URL=${_NEW_API_URL}
      - --build-arg
      - APP_RELEASE=${_APP_RELEASE}
      - --build-arg
      - RELEASE_VERSION=${_RELEASE_VERSION}
      - --build-arg
      - BUILD_TIME=${_BUILD_TIME}
      - --tag
      - ${_IMAGE_URI}
      - .
images:
  - ${_IMAGE_URI}
