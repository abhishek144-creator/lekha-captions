server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'nonce-lekha-template-preview-v1' 'sha256-nuF1+itnyWZpSrGpYCCq2I3cC29kh7Np7md2u0giq4A=' https://apis.google.com https://www.google.com https://www.gstatic.com https://checkout.razorpay.com; frame-src https://www.google.com https://recaptcha.google.com https://*.razorpay.com https://*.firebaseapp.com; connect-src 'self' https://34-93-113-193.sslip.io https://api.lekhacaptions.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://*.razorpay.com https://*.sentry.io https://www.google.com https://www.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /index.html {
    expires -1;
  }

  location = /release.json {
    expires -1;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
