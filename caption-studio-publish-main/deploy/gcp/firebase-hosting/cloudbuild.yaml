steps:
  - name: node:20-bookworm
    id: install
    entrypoint: npm
    args: [ci]

  - name: node:20-bookworm
    id: build
    entrypoint: npm
    args: [run, build]
    env:
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}
      - VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - VITE_FIREBASE_APP_CHECK_SITE_KEY=${_VITE_FIREBASE_APP_CHECK_SITE_KEY}
      - VITE_LEGAL_BUSINESS_NAME=${_VITE_LEGAL_BUSINESS_NAME}
      - VITE_LEGAL_BUSINESS_ADDRESS=${_VITE_LEGAL_BUSINESS_ADDRESS}
      - VITE_GOVERNING_VENUE=${_VITE_GOVERNING_VENUE}
      - VITE_GRIEVANCE_OFFICER_NAME=${_VITE_GRIEVANCE_OFFICER_NAME}
      - VITE_GRIEVANCE_EMAIL=${_VITE_GRIEVANCE_EMAIL}
      - VITE_APP_RELEASE=${_RELEASE}

  # Cloud Run can't map a custom domain in asia-south1, so the API lives at its
  # *.run.app URL; let the hosting CSP's connect-src allow exactly that origin.
  - name: node:20-bookworm
    id: csp-api-origin
    entrypoint: node
    args: [scripts/set-hosting-api-origin.mjs, "${_VITE_API_BASE_URL}", firebase.json]

  - name: us-docker.pkg.dev/firebase-cli/us/firebase
    id: deploy-hosting
    args:
      - deploy
      - --project=${_VITE_FIREBASE_PROJECT_ID}
      - --only=hosting
      - --non-interactive

substitutions:
  # terraform output -raw api_uri
  _VITE_API_BASE_URL: SET_AT_SUBMIT_TIME
  _VITE_FIREBASE_API_KEY: SET_AT_SUBMIT_TIME
  _VITE_FIREBASE_AUTH_DOMAIN: SET_AT_SUBMIT_TIME
  _VITE_FIREBASE_PROJECT_ID: SET_AT_SUBMIT_TIME
  _VITE_FIREBASE_STORAGE_BUCKET: SET_AT_SUBMIT_TIME
  _VITE_FIREBASE_MESSAGING_SENDER_ID: SET_AT_SUBMIT_TIME
  _VITE_FIREBASE_APP_ID: SET_AT_SUBMIT_TIME
  _VITE_FIREBASE_APP_CHECK_SITE_KEY: SET_AT_SUBMIT_TIME
  _VITE_LEGAL_BUSINESS_NAME: SET_AT_SUBMIT_TIME
  _VITE_LEGAL_BUSINESS_ADDRESS: SET_AT_SUBMIT_TIME
  _VITE_GOVERNING_VENUE: SET_AT_SUBMIT_TIME
  _VITE_GRIEVANCE_OFFICER_NAME: SET_AT_SUBMIT_TIME
  _VITE_GRIEVANCE_EMAIL: SET_AT_SUBMIT_TIME
  _RELEASE: SET_AT_SUBMIT_TIME

options:
  logging: CLOUD_LOGGING_ONLY
