# ClamAV daemon for the transcription worker (Railway). It keeps the signature
# database in memory so each upload scan takes seconds; clamscan reloads the
# whole database (about 20-40 s) for every file. The worker reaches it with
# CLAMAV_HOST=127.0.0.1 and falls back to CLAMAV_SCAN_CMD while it is loading.
DatabaseDirectory /opt/clamav-db
TCPSocket 3310
TCPAddr 127.0.0.1
Foreground yes
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
LogTime yes
LogVerbose no
# Uploads may be up to 500 MiB; the default 25 MB stream limit would make
# every larger upload return "size limit exceeded" instead of a verdict.
StreamMaxLength 600M
# Scan depth limits stay at ClamAV's defaults, matching the clamscan path.
# One reload copy of the database at a time keeps memory near 1 GB.
ConcurrentDatabaseReload no
# Signatures only change on redeploy (copied into the image at build time).
SelfCheck 0
