     files (Craft: 5 from each of 1/2/3-STYLE; Foundation and Signature: 10
     each across the styles), converted to the LC DSL read by SidebarTemplateGallery20.jsx
     (parseLcTemplateSet):
       The Craft Set (T71-T95): The Comma T87, The Beam T94, The Skew T93,
         The Triad T95, The Staircase T81
       The Foundation Set (T96-T130): The Framework T102, The Tide T106,
         The Kindling T115, The Meridian T108, The Gravity T104
       The Signature Standard (T101-T135): The Parenthesis T113, The Static
         T120, The Undertone T107, The Bulletin T128, The Backbeat T131

         The Setup, The Hinge, The Column, The Cliff, The Pivot, The
         Counterweight; Foundation The Voyage, The Lantern, The Passage, The
         Northstar, The Skyline; Signature The Ellipsis, The Northline, The
         Meter, The Weave, The Switchback

     is scoped to .lc-picks so the shared LC classes are untouched; motion stays
     on word spans (data-lc-anim) so the editor clock and the export drive it. -->
<style>
